name: Build

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore OllamaModelExplorer.sln
      - name: Build
        run: dotnet build OllamaModelExplorer.sln --configuration Release --no-restore
      - name: Publish single-file Windows executable
        if: github.event_name == 'push'
        run: dotnet publish OllamaModelExplorer.csproj --configuration Release --runtime win-x64 --self-contained true --output publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:DebugType=None
      - name: Stage executable artifact
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item publish\OllamaModelExplorer.exe artifact\OllamaModelExplorer-v0.6.7-win-x64.exe
      - name: Upload executable artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: OllamaModelExplorer-v0.6.7-win-x64
          path: artifact/OllamaModelExplorer-v0.6.7-win-x64.exe
          if-no-files-found: error
          retention-days: 30
