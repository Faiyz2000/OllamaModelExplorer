name: Build

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore OllamaModelExplorer.sln
      - name: Build
        run: dotnet build OllamaModelExplorer.sln --configuration Release --no-restore
      - name: Publish self-contained single-file EXE
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish OllamaModelExplorer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --no-restore
      - name: Upload EXE artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: OllamaModelExplorer-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/OllamaModelExplorer.exe
          if-no-files-found: error
